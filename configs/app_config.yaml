# Application Configuration for AI Call Intelligence Engine

app:
  name: "AI Call Intelligence Engine"
  version: "1.0.0"
  environment: "development"
  log_level: "INFO"

server:
  host: "127.0.0.1"
  port: 8000
  reload: true

database:
  url: "sqlite:///./call_intelligence.db"

storage:
  samples_dir: "data/samples"
  reports_dir: "reports"
  models_dir: "models"
