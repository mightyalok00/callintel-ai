version: '3.8'

services:
  api:
    build: .
    container_name: callintel_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./reports:/app/reports
    command: ["uvicorn", "src.callintel.api.app:app", "--host", "0.0.0.0", "--port", "8000"]

  dashboard:
    build: .
    container_name: callintel_dashboard
    restart: always
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    command: ["streamlit", "run", "dashboard/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
